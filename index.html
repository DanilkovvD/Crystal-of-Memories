<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#FFEAF4"
    >

    <title>Crystal of Memories</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="scene">

        <div class="background-glow glow-1"></div>
        <div class="background-glow glow-2"></div>

        <div class="sparkles" aria-hidden="true">
            <span class="sparkle sparkle-1">✦</span>
            <span class="sparkle sparkle-2">✧</span>
            <span class="sparkle sparkle-3">✦</span>
            <span class="sparkle sparkle-4">✧</span>
            <span class="sparkle sparkle-5">✦</span>
            <span class="sparkle sparkle-6">·</span>
            <span class="sparkle sparkle-7">✧</span>
            <span class="sparkle sparkle-8">·</span>
        </div>

        <section class="crystal-wrapper">

            <div class="crystal">
                <div class="crystal-shine"></div>
                <div class="crystal-highlight"></div>
            </div>

            <p class="hint">
                Touch the Crystal <span aria-hidden="true">✨</span>
            </p>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
