<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#D79AB5"
    >

    <title>Crystal of Memories</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="scene">

        <div class="background-glow glow-1"></div>
        <div class="background-glow glow-2"></div>
        <div class="background-glow glow-3"></div>

        <div class="sparkles" aria-hidden="true">

            <span class="sparkle sparkle-star sparkle-1">✦</span>
            <span class="sparkle sparkle-star sparkle-2">✧</span>

            <span class="sparkle sparkle-dot sparkle-3"></span>

            <span class="sparkle sparkle-star sparkle-4">✦</span>

            <span class="sparkle sparkle-dot sparkle-5"></span>

            <span class="sparkle sparkle-star sparkle-6">✧</span>

            <span class="sparkle sparkle-dot sparkle-7"></span>

            <span class="sparkle sparkle-star sparkle-8">✦</span>

            <span class="sparkle sparkle-dot sparkle-9"></span>

        </div>

        <section class="crystal-wrapper">

            <button
                class="crystal"
                type="button"
                aria-label="Нажми на Кристалл"
            >

                <div class="crystal-depth"></div>

                <div class="crystal-particles" aria-hidden="true">

                    <span class="crystal-particle particle-1"></span>
                    <span class="crystal-particle particle-2"></span>
                    <span class="crystal-particle particle-3"></span>
                    <span class="crystal-particle particle-4"></span>
                    <span class="crystal-particle particle-5"></span>
                    <span class="crystal-particle particle-6"></span>
                    <span class="crystal-particle particle-7"></span>
                    <span class="crystal-particle particle-8"></span>
                    <span class="crystal-particle particle-9"></span>
                    <span class="crystal-particle particle-10"></span>

                    <span class="crystal-star star-1">✦</span>
                    <span class="crystal-star star-2">✧</span>
                    <span class="crystal-star star-3">✦</span>

                </div>

                <div class="crystal-shine"></div>
                <div class="crystal-highlight"></div>

            </button>

            <p class="hint">
                <span>Нажми на Кристалл</span>
                <span class="hint-symbol" aria-hidden="true">✦</span>
            </p>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
